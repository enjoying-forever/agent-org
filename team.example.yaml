# Copy this to team.yaml in the project your agents will work on, then edit it.
#
# The tree: every role names its `superior`. Exactly one role reports to the
# owner (you) - that role is the leader. Move a role by changing its superior.
#
# Communication rules (enforced by the hub; the full law is in the README):
#   - a role reports to / asks help from its DIRECT superior only
#   - a role can instruct and look at anyone below it (its whole subtree)
#   - peers (same superior) may talk to coordinate, but never assign each other work
#   - anyone may reply to a message sent to them
#
# Put strong, expensive models high in the tree (few, decision-heavy messages)
# and cheaper, faster models at the leaves (bulk work).
# List models with: `codex debug models`, `grok models`, `agy models`.

owner: you
project_root: .            # the folder the agents work in, relative to this file
# database: .agent-org/hub.db

# autostart: true          # start an agent by itself when it has work (while the UI is open)
# max_running: 3           # most agents running at once (0: no limit)
# commit_on_accept: true   # with history on, commit each accepted task's files
# checks:                  # must pass before a task can be closed as done
#   - name: tests
#     run: python -m pytest -q
#     when: ["*.py"]       # only when the task changed matching files (default: always)
#     timeout: 300         # seconds

roles:
  leader:
    superior: you
    harness: claude
    model: opus
    effort: high
    duties: >
      Understand the goal, split it into tasks, assign them down the tree,
      and give the final review before reporting to the owner.
    write_scope: [PLAN.md, docs/*]

  tech-lead:
    superior: leader
    harness: codex
    model: gpt-6-luna
    effort: high
    duties: >
      Design the modules and interfaces, hand implementation tasks to your
      workers, and review their code before reporting up.
    write_scope: [src/*]

  worker-a:
    superior: tech-lead
    harness: codex
    model: gpt-6-luna
    effort: low
    duties: Implement the tasks you are given. Keep changes small.
    write_scope: [src/*, tests/*]

  worker-b:
    superior: tech-lead
    harness: antigravity
    model: gemini-3.8-flash-medium
    duties: Write and run tests, and keep the docs in step with the code.
    write_scope: [tests/*, docs/*]

  researcher:
    superior: leader
    harness: grok
    model: grok-4.7
    duties: >
      Research libraries, APIs and prior art on the web, and give second
      opinions on plans. You do not edit project files.
    write_scope: []

# Consultants: when a subordinate asks for help (ask_help), the superior who
# received the request can summon one of these as a temporary subordinate of the
# agent that asked. It opens in its own tab, edits only files handed to it, and
# is dismissed when the problem is solved. `use_for` is what the superior reads
# to judge which tier a problem needs; `max_active` caps how many run at once.
consultants:
  opus-medium:
    harness: claude
    model: claude-opus-5-5
    effort: medium
    max_active: 2
    use_for: everyday problems - unclear errors, API questions, small bugs
  luna-high:
    harness: codex
    model: gpt-6-luna
    effort: high
    max_active: 2
    use_for: tricky code - failing tests, subtle bugs, algorithms
  opus-xhigh:
    harness: claude
    model: claude-opus-5-5
    effort: xhigh
    max_active: 1
    use_for: the hardest problems - design flaws, deep debugging across many files
